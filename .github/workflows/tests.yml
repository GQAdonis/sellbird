# Test matrix. No secrets, no credentials, no network services: the Codex
# tests use a scripted CLI or localhost mocks. The Codex provider supports
# macOS and Linux only; on Windows the suite covers Claude and checks that
# Codex is refused (Codex-only test modules skip themselves there).
#
# This workflow is also the deploy gate (OpenSpec change pipeline-hardening,
# 1.1): images.yml calls it with `workflow_call` on the same commit, and its
# publish and deploy jobs need that call to succeed. Every job below is part of
# the gate, so a red job anywhere stops a release.
name: tests

on:
  pull_request:
  push:
    branches: [main]
    # Runs on its own on main only for pushes that touch a path images.yml
    # ignores: every other push to main runs this workflow through images.yml
    # (the deploy gate), so the matrix is not run twice for it. A push that
    # touches both kinds of path still runs it twice. Keep this list identical
    # to `paths-ignore` in images.yml.
    paths:
      - "*.md"
      - "docs/**"
      - "openspec/**"
      - "infra/**"
      - "tests/**"
      - "harvey/**"
      - "scripts/boundary/**"
      - "scripts/diagnose_overpass.py"
      - ".kbd-orchestrator/**"
      - ".agent-team/**"
      - ".codex/**"
      - ".impeccable/**"
      - ".kimi-code/**"
      - ".opencode/**"
      - ".qwen/**"
      - ".claude/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/workflows/tests.yml"
      - ".github/workflows/deploy.yml"
      - "docker-compose.yml"
      - ".env.example"
      - ".gitignore"
      - "LICENSE"
      - "NOTICE"
  workflow_call:
    inputs:
      control:
        # Negative control from images.yml's workflow_dispatch input. Only
        # `failing-test` changes anything here: it adds a job that fails, so the
        # gate's failure path can be shown without breaking a real test.
        description: "none | failing-test | vulnerable-image"
        type: string
        required: false
        default: none

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install
        run: python -m pip install -e ".[dev]" "setuptools>=68" wheel
      - name: Unit, integration, end-to-end and soak tests
        run: python -m pytest -q
      - name: Installed wheel (scripted Codex CLI on PATH)
        if: runner.os != 'Windows'
        env:
          SELLBIRD_PACKAGE_TESTS: "1"
        run: python -m pytest -q tests/test_packaging.py
      - name: Real Codex CLI 0.159.3 against localhost mocks (no credentials)
        if: runner.os != 'Windows'
        env:
          SELLBIRD_CODEX_CLI_TESTS: "1"
        run: |
          npm install -g @openai/codex@0.159.3
          python -m pytest -q tests/test_codex_cli_surface.py

  # Storage contract against a real Postgres 18 (the server the platform runs).
  # Ubuntu only: Windows and macOS keep SQLite. The Postgres files must run
  # with zero skips once the DSNs are set; a skip here fails the job.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pinned by digest (multi-arch index for postgres:18).
        image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          # Ephemeral service container on the runner; not a credential.
          POSTGRES_PASSWORD: ci-superuser-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,postgres]" "setuptools>=68" wheel
      - name: Install PostgreSQL 18 client (pg_dump 18, psql 18)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version
      - name: Provision roles and database (throwaway passwords)
        run: |
          MIGRATE_PW="$(openssl rand -hex 16)"
          APP_PW="$(openssl rand -hex 16)"
          echo "::add-mask::${MIGRATE_PW}"
          echo "::add-mask::${APP_PW}"
          PGPASSWORD=ci-superuser-throwaway /usr/lib/postgresql/18/bin/psql \
            -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -v migrate_password="${MIGRATE_PW}" -v app_password="${APP_PW}" \
            -f infra/postgres/provision.sql
          {
            echo "SELLBIRD_TEST_PG_MIGRATE_DSN=postgresql://sellbird_migrate:${MIGRATE_PW}@127.0.0.1:5432/sellbird"
            echo "SELLBIRD_TEST_PG_APP_DSN=postgresql://sellbird_app:${APP_PW}@127.0.0.1:5432/sellbird"
            echo "SELLBIRD_TEST_PG_DUMP=/usr/lib/postgresql/18/bin/pg_dump"
          } >> "$GITHUB_ENV"
      - name: Postgres storage tests (zero skips required)
        run: |
          python -m pytest -q -rs \
            --junitxml=postgres-junit.xml \
            tests/storage_contract \
            tests/test_outbox_concurrency.py \
            tests/test_send_safety_parity.py \
            tests/test_storage_move.py \
            tests/test_dashboard_storage_seam.py
      - name: Fail if any Postgres test was skipped
        if: always()
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse("postgres-junit.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"postgres job: {tests} tests, {skipped} skipped")
          if tests == 0 or skipped:
              sys.exit("Postgres tests must all run: zero skips required")
          PY

  # requirements.lock (the image's only dependency input) must match
  # pyproject.toml; regenerate with scripts/ci/lock-requirements.sh.
  lock:
    name: dependency lock is fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv at the pinned version
        run: python -m pip install "uv==$(tr -d '[:space:]' < scripts/ci/uv-version)"
      - name: requirements.lock matches pyproject.toml
        run: bash scripts/ci/check-lock-fresh.sh

  # Negative control for the deploy gate (images.yml workflow_dispatch input
  # `control: failing-test`): this job fails on purpose, so the called workflow
  # concludes failure while every real test still runs and passes. Skipped (not
  # failed) on every other trigger and control value.
  control-failing-test:
    name: negative control (failing test)
    if: inputs.control == 'failing-test'
    runs-on: ubuntu-latest
    steps:
      - name: Fail deliberately
        run: |
          echo "::error::negative control: this job fails on purpose (control=failing-test)"
          exit 1
