# Service accounts for namespace `sellbird`. Neither pod talks to the
# Kubernetes API, so no token is mounted and no Role is bound.
#
# - `sellbird`: the app's account, an ordinary resource of the sync.
# - `sellbird-migrate`: the migration Job's account (design call A7). The Job is
#   a PreSync hook, so it runs before ordinary resources are applied; on a fresh
#   install `sellbird` would not exist yet and the Job could not be created.
#   This account is therefore itself a PreSync hook, at wave -2, one wave before
#   the Job (-1). BeforeHookCreation replaces it at the start of the next sync,
#   before that sync's Job is created, and never while a Job of the current
#   sync is running.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sellbird
  labels:
    app.kubernetes.io/name: sellbird
    app.kubernetes.io/part-of: sellbird
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sellbird-migrate
  labels:
    app.kubernetes.io/name: sellbird
    app.kubernetes.io/part-of: sellbird
    app.kubernetes.io/component: migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
