# Schema migrations (platform contract v1, "Migration flow").
#
# An Argo CD PreSync hook: it runs before any other resource of the sync is
# applied, so the Deployment (sync wave 0) is only rolled once this Job has
# succeeded. If it fails, the sync fails and the running Deployment keeps the
# previous image. BeforeHookCreation deletes the previous Job before the next
# sync creates it again (a Job's pod template is immutable).
#
# It runs `sellbird storage migrate` from the same pinned image as the app, as
# the migration role: the DSN comes only from Secret `sellbird-db-migrate`
# (key SELLBIRD_DATABASE_URL) as SELLBIRD_MIGRATE_DATABASE_URL, which the
# migrate command prefers. It receives no other Secret. SELLBIRD_MIGRATIONS_DIR
# is set in the image. Network: DNS and Postgres only (see networkpolicy.yaml;
# the policies select the pod by its labels, which are unchanged).
#
# It runs as ServiceAccount `sellbird-migrate` (serviceaccount.yaml), a PreSync
# hook at wave -2, so the account exists before this Job is created even on a
# fresh install, where the app's ordinary `sellbird` account is not yet applied.
#
# /data here is a throwaway emptyDir, not the app's `sellbird-data` volume: that
# claim is ReadWriteOnce and still attached to the running app pod during
# PreSync, and migrations need nothing from it.
apiVersion: batch/v1
kind: Job
metadata:
  name: sellbird-migrate
  labels:
    app.kubernetes.io/name: sellbird
    app.kubernetes.io/component: migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sellbird
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: sellbird-migrate
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # Logical name; the overlay's `images` entry pins it to
          # <registry>/<owner>/sellbird:<commit sha>@sha256:<digest>.
          image: sellbird
          imagePullPolicy: IfNotPresent
          args: ["storage", "migrate"]
          env:
            - name: SELLBIRD_MIGRATE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sellbird-db-migrate
                  key: SELLBIRD_DATABASE_URL
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        # Every command seeds /data first; nothing here outlives the Job.
        - name: data
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
